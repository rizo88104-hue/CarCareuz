# /etc/nginx/sites-available/carcare  (keyin: ln -s ../sites-available/carcare /etc/nginx/sites-enabled/)
# carcare.uz ni o'z domeningizga almashtiring. HTTPS ni certbot o'zi qo'shadi:
#   certbot --nginx -d carcare.uz -d www.carcare.uz
server {
    listen 80;
    server_name carcare.uz www.carcare.uz;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
